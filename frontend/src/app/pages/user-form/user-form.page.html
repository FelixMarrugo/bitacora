<ion-content>
  <main class="mx-auto grid w-full max-w-3xl gap-6 p-4 sm:p-6 lg:p-8">
    <header class="grid gap-2">
      <p class="text-sm font-semibold text-sky-700">Accesos del sistema</p>
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        {{ isEditing ? 'Editar usuario' : 'Registrar usuario' }}
      </h1>
      <p class="text-sm text-slate-500">
        {{ isEditing ? 'Actualiza los datos de la cuenta.' : 'Completa los datos de la nueva cuenta.' }}
      </p>
    </header>

    <section *ngIf="isLoading" class="grid justify-items-center gap-3 rounded-xl border border-slate-200 bg-white p-12 text-center text-slate-500">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando usuario...</p>
    </section>

    <form *ngIf="!isLoading" class="grid grid-cols-1 gap-5 rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:grid-cols-2 sm:p-6" (ngSubmit)="save()" novalidate>
      <label class="grid gap-1.5 text-sm font-medium text-slate-700">
        Nombre
        <input
          class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-900 focus:border-sky-600 focus:outline-none focus:ring-4 focus:ring-sky-100"
          [(ngModel)]="firstName"
          name="firstName"
          maxlength="100"
          autocomplete="given-name"
          required
        >
      </label>
      <label class="grid gap-1.5 text-sm font-medium text-slate-700">
        Apellido
        <input
          class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-900 focus:border-sky-600 focus:outline-none focus:ring-4 focus:ring-sky-100"
          [(ngModel)]="lastName"
          name="lastName"
          maxlength="100"
          autocomplete="family-name"
          required
        >
      </label>
      <label class="grid gap-1.5 text-sm font-medium text-slate-700 sm:col-span-2">
        Usuario
        <input
          class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-900 focus:border-sky-600 focus:outline-none focus:ring-4 focus:ring-sky-100"
          [(ngModel)]="username"
          name="username"
          maxlength="100"
          autocomplete="username"
          required
        >
      </label>
      <label class="grid gap-1.5 text-sm font-medium text-slate-700 sm:col-span-2">
        {{ isEditing ? 'Nueva contraseña (opcional)' : 'Contraseña' }}
        <input
          class="rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-900 focus:border-sky-600 focus:outline-none focus:ring-4 focus:ring-sky-100"
          [(ngModel)]="password"
          name="password"
          type="password"
          [required]="!isEditing"
          minlength="6"
          autocomplete="new-password"
        >
        <span class="text-xs font-normal text-slate-500" *ngIf="isEditing">Déjala vacía si no deseas cambiarla.</span>
      </label>

      <label class="flex items-center gap-3 rounded-lg border border-slate-200 px-4 py-3 text-sm font-medium text-slate-700 sm:col-span-2">
        <input
          class="h-4 w-4 rounded border-slate-300 text-sky-700 focus:ring-sky-600"
          type="checkbox"
          [(ngModel)]="active"
          name="active"
        >
        Cuenta activa
      </label>

      <p *ngIf="errorMessage" class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700 sm:col-span-2" role="alert">
        {{ errorMessage }}
      </p>

      <div class="flex flex-col-reverse gap-3 sm:col-span-2 sm:flex-row sm:justify-end">
        <button
          class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100"
          type="button"
          (click)="cancel()"
        >
          Cancelar
        </button>
        <button
          class="inline-flex items-center justify-center gap-2 rounded-lg bg-sky-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-800 focus:outline-none focus:ring-4 focus:ring-sky-200 disabled:cursor-not-allowed disabled:opacity-60"
          type="submit"
          [disabled]="isSaving"
        >
          <ion-spinner *ngIf="isSaving" name="crescent" class="h-4 w-4"></ion-spinner>
          {{ isSaving ? 'Guardando...' : (isEditing ? 'Guardar cambios' : 'Registrar usuario') }}
        </button>
      </div>
    </form>
  </main>
</ion-content>
